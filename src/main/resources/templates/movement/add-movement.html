<div th:insert="~{layout/main :: html}" th:with="content=~{::section}">
    <section class="max-w-xl mx-auto">
        <h2 class="text-2xl font-semibold mb-6">Record New Stock Movement</h2>
        <form th:action="@{/movements/save}" th:object="${movement}" method="post" class="space-y-4 bg-gray-50 p-6 rounded-xl border">
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-1">Select Product</label>
                <select th:field="*{products.id}" class="w-full border p-2.5 rounded-lg bg-white">
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name} + ' (Current: ' + ${p.quantity} + ')'"></option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Movement Type</label>
                    <select th:field="*{type}" class="w-full border p-2.5 rounded-lg bg-white">
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Quantity</label>
                    <input type="number" th:field="*{quantity}" class="w-full border p-2.5 rounded-lg" min="1" required />
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-600 mb-1">Date</label>
                <input type="date" th:field="*{date}" class="w-full border p-2.5 rounded-lg" />
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">
                    Submit Record
                </button>
            </div>
        </form>
    </section>
</div>
