<div th:insert="~{layout/main :: html}" th:with="content=~{::section}">
    <section class="max-w-2xl mx-auto">
        <h2 class="text-2xl font-semibold mb-6">Register New Supplier</h2>
        <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Supplier Name</label>
                <input type="text" th:field="*{name}" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Global Tech Inc" required />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                <input type="text" th:field="*{city}" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Casablanca" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="number" th:field="*{phone}" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="212..." />
            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-blue-700">Save Supplier</button>
                <a th:href="@{/suppliers}" class="bg-gray-200 text-gray-700 px-6 py-2.5 rounded-lg font-semibold hover:bg-gray-300 text-center">Cancel</a>
            </div>
        </form>
    </section>
</div>
