<div th:insert="~{layout/main :: html}" th:with="content=~{::section}">
    <section>
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">Supplier Directory</h2>
            <a th:href="@{/suppliers/add}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                + Register Supplier
            </a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse bg-white">
                <thead>
                <tr class="bg-gray-100 border-b">
                    <th class="p-4 font-bold text-gray-700">ID</th>
                    <th class="p-4 font-bold text-gray-700">Company Name</th>
                    <th class="p-4 font-bold text-gray-700">City</th>
                    <th class="p-4 font-bold text-gray-700">Phone</th>
                    <th class="p-4 font-bold text-gray-700 text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${suppliers}" class="border-b hover:bg-gray-50">
                    <td class="p-4" th:text="${s.id}"></td>
                    <td class="p-4 font-medium" th:text="${s.name}"></td>
                    <td class="p-4" th:text="${s.city}"></td>
                    <td class="p-4" th:text="${s.phone}"></td>
                    <td class="p-4 text-center">
                        <a th:href="@{/suppliers/delete/{id}(id=${s.id})}"
                           class="text-red-500 hover:text-red-700 font-semibold"
                           onclick="return confirm('Are you sure you want to remove this supplier?')">
                            Remove
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
