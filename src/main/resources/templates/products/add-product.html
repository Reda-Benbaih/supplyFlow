<div th:insert="~{layout/main :: html}" th:with="content=~{::section}">
    <section>
        <h2 class="text-2xl font-semibold mb-6">Add New Product</h2>
        <form th:action="@{/products/save}" th:object="${product}" method="post" class="space-y-4 max-w-lg">
            <div>
                <label class="block text-gray-700">Name</label>
                <input type="text" th:field="*{name}" class="w-full border p-2 rounded" required />
            </div>
            <div>
                <label class="block text-gray-700">Category</label>
                <input type="text" th:field="*{category}" class="w-full border p-2 rounded" />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700">Price</label>
                    <input type="number" step="0.01" th:field="*{price}" class="w-full border p-2 rounded" />
                </div>
                <div>
                    <label class="block text-gray-700">Initial Quantity</label>
                    <input type="number" th:field="*{quantity}" class="w-full border p-2 rounded" />
                </div>
            </div>
            <div>
                <label class="block text-gray-700">Supplier</label>
                <select th:field="*{supplier}" class="w-full border p-2 rounded">
                    <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                </select>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded">Save Product</button>
        </form>
    </section>
</div>
